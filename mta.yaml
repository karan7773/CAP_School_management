_schema-version: 3.3.0
ID: school_management
description: A simple CAP project.
version: 1.0.0
modules:
- name: school_management-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: school_management-db
  - name: uaa_school_management
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: school_management-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: school_management-db
  parameters:
    buildpack: nodejs_buildpack
- name: school_management-destination-content
  type: com.sap.application.content
  requires:
  - name: school_management-destination-service
    parameters:
      content-target: true
  - name: school_management_html_repo_host
    parameters:
      service-key:
        name: school_management_html_repo_host-key
  - name: uaa_school_management
    parameters:
      service-key:
        name: uaa_school_management-key
  parameters:
    content:
      instance:
        destinations:
        - Name: student_manage_school_management_html_repo_host
          ServiceInstanceName: school_management-html5-app-host-service
          ServiceKeyName: school_management_html_repo_host-key
          sap.cloud.service: student_manage
        - Authentication: OAuth2UserTokenExchange
          Name: student_manage_uaa_school_management
          ServiceInstanceName: school_management-xsuaa-service
          ServiceKeyName: uaa_school_management-key
          sap.cloud.service: student_manage
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: school_management-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: school_management_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - studentmanage.zip
      name: studentmanage
      target-path: resources/
- name: studentmanage
  type: html5
  path: app/student_manage
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: school_management-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: school_management-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: books-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: school_management-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: school_management-destination-service
    service-plan: lite
  requires:
  - name: srv-api
- name: school_management_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: school_management-html5-app-host-service
    service-plan: app-host
- name: uaa_school_management
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: school_management-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
